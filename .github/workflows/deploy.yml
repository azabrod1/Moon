name: Deploy to GitHub Pages

on:
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx tsc
      - run: npm test
      # Sector tile sets ship from their own repo through jsDelivr (see
      # "Publishing tiles" in CLAUDE.md): only 7 of the 10 sets the app names
      # are small enough to live in public/, and with no origin set the build
      # throws for each of the other three rather than deploy a 404. The host
      # is in .env.production, which this build reads like any other, so the
      # artifact CI uploads is what a local `npm run build` produces — naming
      # it here as well would be a second copy able to drift from the one the
      # app and the service worker are actually built against.
      - run: npx vite build --base=/Moon/
      # upload-pages-artifact@v4+ drops dotfiles from the artifact — fine here,
      # dist/ has none (deploy-pages serves the artifact as-is, no Jekyll).
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
